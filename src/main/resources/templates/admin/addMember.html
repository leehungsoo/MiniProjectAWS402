<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
      window.addEventListener("DOMContentLoaded", function () {
          const btnCancel = document.querySelector("#btnCancel");
          btnCancel.addEventListener("click", function () {
              history.back()
          });
      });
  </script>

</head>
<body>
<header>
  <nav th:replace="~{layout/header_test::navigator}"></nav>
</header>
<main class="container mt-5">
  <div class="row">
    <form action="/admin/addMember" method="post">
      <div class="col-sm mt-2">
        <div class="form-floating">
          <input type="text" class="form-control" id="member-id" name="memberId" required>
          <label for="member-id" class="form-label">아이디</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-pwd" name="memberPwd" required>
          <label for="member-pwd" class="form-label">비밀번호</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-name" name="memberName" required>
          <label for="member-name" class="form-label">이름</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-phone" name="memberPhone" required>
          <label for="member-phone" class="form-label">전화번호</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-email" name="memberEmail">
          <label for="member-email" class="form-label">이메일</label>
        </div>
        <div class="form-floating">
          <select class="form-select" id="member-gender" name="memberGender" required>
            <option value="M">남성</option>
            <option value="F">여성</option>
          </select>
          <label for="member-gender" class="form-label">성별</label>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-2">
        <button type="reset" class="btn btn-warning" id="btnCancel">취소</button>
        <button type="submit" class="btn btn-primary ms-2" id="btnOk">확인</button>
      </div>
    </form>
  </div>
</main>

</body>
</html>
