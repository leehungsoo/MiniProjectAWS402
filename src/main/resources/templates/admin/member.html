<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <style>
  </style>

  <script>
      window.addEventListener("DOMContentLoaded", function () {
        const addMember = document.querySelector("#add-member");
        addMember.addEventListener("click", function () {
          location.href="/admin/addMember";
        });
      });
  </script>
</head>
<body>
<header>
  <nav th:replace="~{layout/header_test::navigator}"></nav>
</header>
<main class="container mt-5">
  <div class="row">
    <div class="col-sm">
      <table class="table table-hover">
        <thead class="text-center">
        <tr>
          <td>번호</td>
          <td>아이디</td>
          <td>이름</td>
          <td>가입일</td>
          <td>상태</td>
        </tr>
        </thead>
        <tbody id="member_list" class="text-center">
        <tr th:if="${#lists.size(pageMemberList.getList())>0}" th:each="member : ${pageMemberList.getList()}" th:onclick="|location.href='@{/admin/member/}${member.memberIdx}'|">
          <td th:text="${member.memberIdx}"></td>
          <td th:text="${member.memberId}"></td>
          <td th:text="${member.memberName}"></td>
          <td th:text="${member.memberJoinDate}"></td>
          <td th:switch="${member.memberStatus}">
            <span th:case="0" class="text-danger">탈퇴</span>
            <span th:case="1" class="text-primary">정상</span>
          </td>
        </tr>
        <tr th:unless="${#lists.size(pageMemberList.getList())>0}">
          <td colspan="5" class="text-center">
            <p>회원 정보가 없습니다.</p>
          </td>
        </tr>
        </tbody>
      </table>
      <div class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${pageMemberList.getPrePage()==0}?'disabled'">
            <a href="#" class="page-link" th:href="@{/page/board(pageNum=${pageMemberList.getPrePage()})}">&laquo;</a>
          </li>
          <li class="page-item" th:each="page:${#numbers.sequence(pageMemberList.getNavigateFirstPage(), pageMemberList.getNavigateLastPage())}" th:classappend="${page==pageMemberList.getPageNum()} ? 'active'">
            <a href="#" class="page-link" th:href="@{/admin/member(pageNum=${page})}" th:text="${page}"></a>
          </li>
          <li class="page-item" th:classappend="${pageMemberList.getNextPage()==0}?'disabled'">
            <a href="#" class="page-link" th:href="@{/admin/member(pageNum=${pageMemberList.getNextPage()})}">&raquo;</a>
          </li>
        </ul>
      </div>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-primary" id="add-member">추가</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
