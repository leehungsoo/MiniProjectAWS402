<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>

</head>
<body>
<header>
  <nav th:replace="~{layout/header_test::navigator}"></nav>
</header>
<main class="container mt-5">
  <div class="row">
    <div class="col-sm">
      <table class="table table-hover">
        <thead class="text-center">
        <tr>
          <td>번호</td>
          <td>이름</td>
        </tr>
        </thead>
        <tbody id="room_list" class="text-center">
        <tr th:if="${#lists.size(roomList)} > 0" th:each="room : ${roomList}" th:onclick="|location.href='@{/admin/room/}${room.roomIdx}'|">
          <td th:text="${room.roomIdx}"></td>
          <td th:text="${room.roomName}"></td>
        </tr>
        <tr th:unless="${#lists.size(roomList)>0}">
          <td colspan="5" class="text-center">
            <p>객실 정보가 없습니다.</p>
          </td>
        </tr>
        </tbody>
      </table>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-primary" id="add-room">추가</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
