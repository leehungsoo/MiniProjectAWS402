<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
      window.addEventListener('DOMContentLoaded', function () {
          const editMember = document.querySelector("#edit-member");
          const editBtnGroup = document.querySelector("#edit_btn_group");
          const editOk = document.querySelector("#edit-ok");
          const editCancel = document.querySelector("#edit-cancel");
          editMember.addEventListener("click", function () {
              editMember.classList.toggle("d-none");
              editBtnGroup.classList.toggle("d-none");
              toggleEditMember();
          });
          editCancel.addEventListener("click", function () {
              location.reload();
          });
          editOk.addEventListener("click", function () {
              document.querySelector("#frm").submit();
          });
      });

      function toggleEditMember() {
          document.querySelector("#member-id").toggleAttribute("disabled");
          document.querySelector("#member-name").toggleAttribute("disabled");
          document.querySelector("#member-phone").toggleAttribute("disabled");
          document.querySelector("#member-email").toggleAttribute("disabled");
          document.querySelector("#member-gender").toggleAttribute("disabled");
          document.querySelector("#member-status").toggleAttribute("disabled");
      }
  </script>

</head>
<body>
<header>
  <nav th:replace="~{layout/header_test::navigator}"></nav>
</header>
<main class="container mt-5">
  <div class="row">
    <form action="/admin/member" method="post" id="frm">
      <input type="hidden" name="memberIdx" th:value="${member.memberIdx}">
      <div class="col-sm mt-2">
        <div class="form-floating">
          <input type="text" class="form-control" id="member-idx" disabled
                 th:value="${member.memberIdx}">
          <label for="member-idx" class="form-label">번호</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-id" name="memberId" disabled th:value="${member.memberId}">
          <label for="member-id" class="form-label">아이디</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-name" name="memberName" disabled
                 th:value="${member.memberName}">
          <label for="member-name" class="form-label">이름</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-phone" name="memberPhone" disabled
                 th:value="${member.memberPhone}">
          <label for="member-phone" class="form-label">전화번호</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-email" name="memberEmail" disabled
                 th:value="${member.memberEmail}">
          <label for="member-email" class="form-label">이메일</label>
        </div>
        <div class="form-floating">
          <input type="text" class="form-control" id="member-join_date" disabled th:value="${member.memberJoinDate}">
          <label for="member-join_date" class="form-label">가입일</label>
        </div>
        <div class="form-floating">
          <select class="form-select" id="member-gender" name="memberGender" disabled>
            <option value="M" th:selected="${member.memberGender=='M'}">남성</option>
            <option value="F" th:selected="${member.memberGender=='F'}">여성</option>
          </select>
          <label for="member-gender" class="form-label">성별</label>
        </div>
        <div class="form-floating">
          <select class="form-select" id="member-status" name="memberStatus" disabled>
            <option value="1" th:selected="${member.memberStatus=='1'}">정상</option>
            <option value="0" th:selected="${member.memberStatus=='0'}">탈퇴</option>
          </select>
          <label for="member-status" class="form-label">상태</label>
        </div>
      </div>
    </form>
  </div>
  <div class="row mt-2">
    <div class="col-sm clearfix">
      <button type="button" class="btn btn-secondary float-start" id="btn_list">목록</button>
      <button type="button" class="btn btn-primary float-end" id="edit-member">수정</button>
      <div class="float-end d-none" id="edit_btn_group">
        <button type="button" class="btn btn-primary" id="edit-cancel">취소</button>
        <button type="button" class="btn btn-primary" id="edit-ok">확인</button>
      </div>
    </div>
  </div>
</main>

</body>
</html>
